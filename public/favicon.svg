<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="faviconLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3B30" />
      <stop offset="100%" stop-color="#E53935" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Square (border radius ~22%) -->
  <rect width="512" height="512" rx="112" fill="url(#faviconLogoGrad)" />
  
  <!-- Radiating Arcs -->
  <g fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round">
    <!-- Outer Arc -->
    <path d="M 145 190 A 155 155 0 0 1 367 190" />
    <!-- Middle Arc -->
    <path d="M 182 216 A 110 110 0 0 1 330 216" />
    <!-- Inner Arc -->
    <path d="M 218 242 A 65 65 0 0 1 294 242" />
  </g>

  <!-- Tower legs -->
  <g fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Leg: from (256, 260) to (180, 420) -->
    <!-- Right Leg: from (256, 260) to (332, 420) -->
    <path d="M 256 260 L 180 420" />
    <path d="M 256 260 L 332 420" />
    <!-- Horizontal Cross braces -->
    <path d="M 218 340 L 294 340" />
    <path d="M 197 385 L 315 385" />
  </g>
  
  <!-- Transmitter Dot at the top of the tower -->
  <circle cx="256" cy="250" r="18" fill="#FFFFFF" />

  <!-- Subtle Lightning Bolt integrated in base -->
  <polygon points="268,295 240,350 262,350 248,405 282,342 260,342" fill="#FFFFFF" />
</svg>
